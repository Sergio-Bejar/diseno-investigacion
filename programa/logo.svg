<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <!-- Geometric icon: abstract compass/diamond suggesting inquiry -->
  <g transform="translate(360, 52)">
    <!-- Outer diamond (rotated square) -->
    <rect x="-30" y="-30" width="60" height="60" rx="4" transform="rotate(45)" fill="none" stroke="#c45b28" stroke-width="2.5"/>
    <!-- Inner diamond -->
    <rect x="-14" y="-14" width="28" height="28" rx="2" transform="rotate(45)" fill="#c45b28" opacity="0.15"/>
    <!-- Crosshair lines -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#1a1a2e" stroke-width="1.5" opacity="0.2"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#1a1a2e" stroke-width="1.5" opacity="0.2"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#c45b28"/>
  </g>
  <!-- Course name -->
  <text x="360" y="140" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="300" letter-spacing="10" fill="#1a1a2e">DISEÑO DE</text>
  <text x="360" y="188" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="300" letter-spacing="10" fill="#1a1a2e">INVESTIGACIÓN</text>
  <!-- Accent line -->
  <rect x="330" y="202" width="60" height="3" rx="1.5" fill="#c45b28"/>
  <!-- Number -->
  <text x="360" y="240" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="6" fill="#c45b28">I</text>
</svg>
